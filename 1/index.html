<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123840" />
    <meta name="description" content="WMC presents The 1% Club — a live multiplayer gameshow experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/1/assets/favicon-BQQZV5Zy.png" />
    <title>Host · WMC The 1% Club</title>
    <script type="module" crossorigin src="/1/assets/game-CIzcMyBG.js"></script>
    <link rel="stylesheet" crossorigin href="/1/assets/game-Afv2DRAH.css">
  </head>
  <body data-page="host">
    <div class="ambient" aria-hidden="true"></div>
    <div class="host-loader" id="host-loader" aria-label="Loading The 1% Club">
      <div class="host-loader-glow" aria-hidden="true"></div>
      <section class="host-loader-card">
        <img src="/1/assets/wmc-one-percent-logo-DSn5Umzs.webp" width="1024" height="1024" fetchpriority="high" decoding="async" alt="WMC presents The 1% Club" />
        <span>WMC presents</span>
        <strong>Opening The 1% Club</strong>
        <div class="host-loader-track" aria-hidden="true"><i></i></div>
        <small>Preparing the studio</small>
      </section>
    </div>
    <main id="app"></main>
    <div class="how-overlay" id="how-overlay" hidden aria-hidden="true" role="dialog" aria-label="How It Works video">
      <video playsinline preload="none"></video>
      <div class="how-video-loader">
        <span class="media-spinner"><i></i></span>
        <span class="broadcast-kicker" data-video-kicker><i></i> Studio video</span>
        <strong data-video-message>Preparing the complete video</strong>
        <div class="video-progress" data-video-progress><i></i></div>
        <small data-video-progress-label>Loading 0%</small>
      </div>
      <button class="how-close" type="button" data-close-how aria-label="Close How It Works video">×</button>
    </div>
  </body>
</html>
