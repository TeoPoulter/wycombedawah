 app.querySelector('.now-playing-copy small').textContent=`${musicAudio.paused?'Ready to play':'Now playing'} · ${currentPlaylist().title}`;
 app.querySelectorAll('.track-number').forEach((el,i)=>{el.innerHTML=i===musicState.trackIndex&&!musicAudio.paused?'<span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span>':String(i+1).padStart(2,'0')});
 if('mediaSession' in navigator)navigator.mediaSession.playbackState=musicAudio.paused?'paused':'playing';
}

function panel(playlist,track,duration,openClass,hidden){
return `<div class="music-scrim ${openClass}" aria-hidden="${hidden}" data-music-close>
      <section class="music-panel" aria-label="Nasheed player">
        <header class="music-panel-head">
          <div><span class="broadcast-kicker"><i></i> WMC sound</span><h1>Nasheed archive</h1></div>
          <a class="back-link" href="/1/">Game show ↗</a>
        </header>
        <div class="playlist-switcher">
          ${musicLibrary.playlists.map((item) => `<button type="button" class="playlist-card ${item.id === playlist?.id ? 'active' : ''}" aria-pressed="${item.id===playlist?.id}" data-playlist="${esc(item.id)}"><img src="${esc(item.cover)}" alt=""><span><strong>${esc(item.title)}</strong><small>${item.tracks.length} tracks</small></span></button>`).join('')}
        </div>
        <div class="now-playing">
          <img src="${esc(playlist?.cover || '')}" alt="${esc(playlist?.title || '')} cover">
          <div class="now-playing-copy"><small>${musicAudio.paused ? 'Ready to play' : 'Now playing'} · ${esc(playlist?.title || '')}</small><strong>${esc(track?.title || 'Choose a track')}</strong><span>${esc(playlist?.description || '')}</span></div>
          <div class="transport-controls">
            <button type="button" data-music-shuffle class="${musicState.shuffle ? 'active' : ''}" aria-label="Shuffle">${icon('shuffle')}</button>
            <button type="button" data-music-prev aria-label="Previous track">${icon('previous')}</button>
            <button type="button" class="transport-play" data-music-play aria-label="${musicAudio.paused ? 'Play' : 'Pause'}">${icon(musicAudio.paused ? 'play' : 'pause')}</button>
            <button type="button" data-music-next aria-label="Next track">${icon('next')}</button>
          </div>
        </div>
        <div class="music-timeline">
          <input type="range" min="0" max="100" value="${duration ? (musicAudio.currentTime / duration) * 100 : 0}" data-music-progress aria-label="Track position">
          <small data-music-elapsed>${formatTime(musicAudio.currentTime)} / ${formatTime(duration)}</small>
          <label>${icon('volume')}<input type="range" min="0" max="1" step="0.01" value="${musicState.volume}" data-music-volume aria-label="Volume"></label>
        </div>
        <div class="track-list" aria-label="${esc(playlist?.title || '')} tracks">
          ${playlist?.tracks?.map((item, index) => `<button type="button" class="track-row ${index === musicState.trackIndex ? 'active' : ''}" aria-current="${index===musicState.trackIndex}" data-track="${index}"><span class="track-number">${index === musicState.trackIndex && !musicAudio.paused ? icon('music') : String(index + 1).padStart(2, '0')}</span><span><strong>${esc(item.title)}</strong><small>${formatTime(item.duration)}</small></span>${index === musicState.trackIndex ? '<i>Selected</i>' : ''}</button>`).join('') || ''}
        </div>
      </section>
    </div>`;
}
function load(){const t=currentTrack();musicAudio.src=t.src;musicAudio.load();if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'WMC Nasheed Archive',album:currentPlaylist().title,artwork:[{src:new URL(currentPlaylist().cover,location.origin).href,type:'image/webp'}]})}}
async function play(){try{if(!musicAudio.src)load();await musicAudio.play();document.querySelector('#status').textContent=''}catch{document.querySelector('#status').textContent='Unable to play this track. Press play to try again.'}syncPlayback()}
function next(d=1){const n=currentPlaylist().tracks.length;musicState.trackIndex=musicState.shuffle&&n>1?(musicState.trackIndex+1+Math.floor(Math.random()*(n-1)))%n:(musicState.trackIndex+d+n)%n;load();save();render();play()}
function progress(){const d=Number(musicAudio.duration)||currentTrack().duration,p=app.querySelector('[data-music-progress]');p.value=d?musicAudio.currentTime/d*100:0;p.style.setProperty('--music-progress',p.value+'%');app.querySelector('[data-music-elapsed]').textContent=formatTime(musicAudio.currentTime)+' / '+formatTime(d)}
function bind(){
app.querySelectorAll('[data-playlist]').forEach(b=>b.onclick=()=>{musicAudio.pause();musicState.playlistId=b.dataset.playlist;musicState.trackIndex=0;load();save();render()});
app.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{musicState.trackIndex=Number(b.dataset.track);load();save();render();play()});
app.querySelector('[data-music-play]').onclick=()=>musicAudio.paused?play():musicAudio.pause();
app.querySelector('[data-music-next]').onclick=()=>next();app.querySelector('[data-music-prev]').onclick=()=>musicAudio.currentTime>3?(musicAudio.currentTime=0):next(-1);
const shuffle=app.querySelector('[data-music-shuffle]');shuffle.setAttribute('aria-pressed',musicState.shuffle);shuffle.onclick=()=>{musicState.shuffle=!musicState.shuffle;save();shuffle.classList.toggle('active',musicState.shuffle);shuffle.setAttribute('aria-pressed',musicState.shuffle)};
app.querySelector('[data-music-progress]').oninput=e=>{if(Number.isFinite(musicAudio.duration))musicAudio.currentTime=Number(e.target.value)/100*musicAudio.duration;progress();save()};
const v=app.querySelector('[data-music-volume]');v.style.setProperty('--value',musicState.volume);v.oninput=e=>{musicState.volume=Number(e.target.value);musicAudio.volume=musicState.volume;v.style.setProperty('--value',musicState.volume);save()};
}
musicAudio.addEventListener('timeupdate',()=>{progress();if(Math.floor(musicAudio.currentTime)%5===0)save()});
for(const e of ['play','pause'])musicAudio.addEventListener(e,()=>{syncPlayback();save()});
musicAudio.addEventListener('loadedmetadata',progress);musicAudio.addEventListener('ended',()=>next());
musicAudio.addEventListener('error',()=>{document.querySelector('#status').textContent='This nasheed could not load. Try again or select another track.'});
if('mediaSession' in navigator){for(const [name,fn] of Object.entries({play:()=>play(),pause:()=>musicAudio.pause(),previoustrack:()=>next(-1),nexttrack:()=>next(),seekto:e=>{if(Number.isFinite(e.seekTime))musicAudio.currentTime=e.seekTime}})){try{navigator.mediaSession.setActionHandler(name,fn)}catch{}}}
window.addEventListener('pagehide',save);
try{const r=await fetch('/1/media/nasheeds/library.json');if(!r.ok)throw Error();musicLibrary=await r.json();musicState.playlistId=currentPlaylist().id;musicState.trackIndex=Math.max(0,Math.min(musicState.trackIndex,currentPlaylist().tracks.length-1));load();musicAudio.addEventListener('loadedmetadata',()=>{if(saved.time>0&&saved.time<musicAudio.duration)musicAudio.currentTime=saved.time},{once:true});render()}catch{app.innerHTML='<p>The nasheed archive could not load. Please refresh to try again.</p>'}
</script></head><body><main id="app" aria-label="WMC Nasheed Archive"><p>Preparing your nasheed archive…</p></main><p id="status" role="status" aria-live="polite"></p></body></html>
