  paths='<g class="constellation"><path class="line quiet" d="M45 130L160 75L285 135M755 875L860 930L960 860"/><g fill="currentColor"><circle cx="45" cy="130" r="2"/><circle cx="160" cy="75" r="2"/><circle cx="285" cy="135" r="2"/><circle cx="755" cy="875" r="2"/><circle cx="860" cy="930" r="2"/><circle cx="960" cy="860" r="2"/></g></g>';
 }else if(effect==='waves'){
  paths=[0,1,2].map(i=>`<path class="line wave" style="--delay:-${i*5}s" d="M-40 ${865+i*27}Q230 ${805+i*27} 500 ${865+i*27}T1040 ${865+i*27}"/>`).join('');
 }
 if(!paths)return null;
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('screen-decor');svg.setAttribute('viewBox','0 0 1000 1000');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');
 svg.innerHTML=`<defs><clipPath id="${id}"><path d="M0 0H1000V1000H0Z M120 230V770H880V230Z" clip-rule="evenodd" fill-rule="evenodd"/></clipPath></defs><g clip-path="url(#${id})">${paths}</g>`;
 return svg;
}
function show(){
 const view=views[selected],scene=document.createElement('div');scene.className='screen-scene';scene.dataset.screenId=view.id;scene.dataset.effect=view.effect||'plain';scene.dataset.brand=view.brand||'';scene.dataset.motion=view.motion||'none';scene.style.setProperty('--screen-bg',view.background);scene.style.setProperty('--screen-accent',view.accent||'#d2a96e55');
 scene.style.setProperty('--motion-a',view.motionA||'#2e807866');scene.style.setProperty('--motion-b',view.motionB||'#d2a96e22');
 scene.style.setProperty('--motion-c',view.motionC||'#277fba55');
 if(view.motion){const atmosphere=document.createElement('div');atmosphere.className='screen-atmosphere';atmosphere.setAttribute('aria-hidden','true');scene.append(atmosphere)}
 const decor=decoration(view.effect,view.motion);if(decor)scene.append(decor);
 if(view.src){const img=new Image();img.alt=view.alt;img.className='screen-logo';img.src=view.src;img.draggable=false;scene.append(img)}
 const prior=canvas.lastElementChild;while(canvas.children.length>1)canvas.firstElementChild.remove();canvas.append(scene);screen.setAttribute('aria-label',view.name+'. Left or right to change. Up or down to switch brand. Back or Escape to exit.');
 if(prior&&typeof scene.animate==='function'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){scene.animate([{opacity:0},{opacity:1}],{duration:420,easing:'ease-out'}).finished.then(()=>prior.remove()).catch(()=>prior.remove())}else prior?.remove();
 try{localStorage.setItem('wmc-screen-view-id',view.id)}catch{}
}
function change(step){selected=(selected+step+views.length)%views.length;show()}
async function fullscreen(){try{if(!document.fullscreenElement){if(screen.requestFullscreen)await screen.requestFullscreen();else if(screen.webkitRequestFullscreen)screen.webkitRequestFullscreen()}}catch{}}
function open(){priorFocus=document.activeElement;screen.hidden=false;player.inert=true;player.setAttribute('aria-hidden','true');document.body.style.overflow='hidden';document.documentElement.style.overflow='hidden';show();screen.focus();fullscreen()}
async function close(){screen.hidden=true;canvas.replaceChildren();player.inert=false;player.removeAttribute('aria-hidden');document.body.style.overflow='';document.documentElement.style.overflow='';if(document.fullscreenElement===screen)await document.exitFullscreen().catch(()=>{});priorFocus?.focus()}
screen.addEventListener('click',()=>change(1));
document.addEventListener('keydown',e=>{if(screen.hidden)return;if(['ArrowRight','ArrowLeft','Enter',' '].includes(e.key)){e.preventDefault();change(e.key==='ArrowLeft'?-1:1)}else if(['Escape','Backspace','BrowserBack'].includes(e.key)||[4,10009].includes(e.keyCode)){e.preventDefault();close()}else if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const nextBrand=views[selected].brand==='criterion'?'wmc':'criterion';selected=views.findIndex(v=>v.brand===nextBrand);show()}else if(e.key==='Home'||e.key==='End'){e.preventDefault();selected=e.key==='Home'?0:views.length-1;show()}else if(e.key==='Tab'){e.preventDefault();screen.focus()}});
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement===screen)wasFullscreen=true;else if(wasFullscreen&&!screen.hidden){wasFullscreen=false;close()}});
function install(){const head=player.querySelector('.music-panel-head');if(!head||head.querySelector('.screen-launch'))return;const button=document.createElement('button');button.type='button';button.className='screen-launch';button.title='Full screen: left/right arrows, Enter or tap to change style; up/down switches WMC and Criterion. Back/Escape exits. Your choice is remembered.';button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg> Screen';button.onclick=open;head.append(button)}
document.addEventListener('visibilitychange',()=>screen.classList.toggle('motion-paused',document.hidden));
new MutationObserver(install).observe(player,{childList:true,subtree:true});install();
</script></body></html>
