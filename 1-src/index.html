<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123840" />
    <meta name="description" content="WMC presents The 1% Club — a live multiplayer gameshow experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="./assets/wmc-one-percent-logo.webp" fetchpriority="high" />
    <link rel="icon" href="./assets/favicon.png" />
    <title>Host · WMC The 1% Club</title>
    <style>
      html,body{margin:0;min-height:100%;background:#031114;color:#fff}
      #host-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,rgba(210,169,110,.14),transparent 28%),linear-gradient(145deg,#0a2c32,#010506 72%)}
      #host-loader .host-loader-card{display:grid;width:min(540px,calc(100% - 46px));justify-items:center;padding:34px;text-align:center}
      #host-loader .host-loader-mark{position:relative;display:grid;width:min(210px,38vw);aspect-ratio:1;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(210,169,110,.12),rgba(1,10,12,.88) 68%)}
      #host-loader .host-loader-mark img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;opacity:0}
      #host-loader.art-ready .host-loader-mark img{opacity:1}
      #host-loader .host-loader-fallback{color:#f1d59d;font:900 clamp(58px,9vw,94px)/1 Arial,sans-serif;letter-spacing:-.09em}
      #host-loader.art-ready .host-loader-fallback{opacity:0}
      #host-loader .host-loader-eyebrow{color:#d2a96e;font:800 10px/1 Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase}
    </style>
    <link rel="stylesheet" href="./assets/game.css" />
  </head>
  <body data-page="host">
    <div class="ambient" aria-hidden="true"></div>
    <div class="host-loader" id="host-loader" aria-label="Loading The 1% Club">
      <div class="host-loader-glow" aria-hidden="true"><i></i><i></i></div>
      <section class="host-loader-card">
        <span class="host-loader-eyebrow">WMC presents</span>
        <div class="host-loader-mark" aria-label="WMC The 1% Club"><span class="host-loader-fallback" aria-hidden="true">1%</span><img src="./assets/wmc-one-percent-logo.webp" alt="WMC The 1% Club"></div>
        <strong>The 1% Club</strong>
        <div class="host-loader-track" aria-hidden="true"><i></i></div>
        <small>Preparing the live studio</small>
      </section>
    </div>
    <main id="app"></main>
    <div class="how-overlay" id="how-overlay" hidden aria-hidden="true" role="dialog" aria-label="How It Works video">
      <video playsinline preload="none"></video>
      <div class="how-video-loader">
        <span class="media-spinner"><i></i></span>
        <span class="broadcast-kicker" data-video-kicker><i></i> Studio video</span>
        <strong data-video-message>Preparing the complete video</strong>
        <div class="video-progress" data-video-progress><i></i></div>
        <small data-video-progress-label>Loading 0%</small>
      </div>
      <button class="how-close" type="button" data-close-how aria-label="Close How It Works video">×</button>
    </div>
    <script type="module" src="./assets/game.js"></script>
  </body>
</html>
