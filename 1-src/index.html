<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123840" />
    <meta name="description" content="WMC presents The 1% Club — a live multiplayer gameshow experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="./assets/favicon.png" />
    <title>Host · WMC The 1% Club</title>
    <style>
      html,body{margin:0;min-height:100%;background:#031114;color:#fff}
      #host-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 36%,rgba(210,169,110,.18),transparent 29%),linear-gradient(145deg,#0a2c32,#010506 72%)}
      #host-loader .host-loader-card{display:grid;width:min(430px,calc(100% - 46px));justify-items:center;padding:34px;text-align:center}
      #host-loader .host-loader-mark{display:grid;width:min(240px,58vw);aspect-ratio:1;place-content:center;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(210,169,110,.15),rgba(1,10,12,.96) 65%);text-align:center}
      #host-loader .host-loader-mark span{color:#d2a96e;font:900 clamp(30px,7vw,64px)/.85 Arial,sans-serif;letter-spacing:-.09em}
      #host-loader .host-loader-mark strong{color:#f1d59d;font:900 clamp(48px,11vw,98px)/.9 Arial,sans-serif;letter-spacing:-.09em}
    </style>
    <link rel="stylesheet" href="./assets/game.css" />
  </head>
  <body data-page="host">
    <div class="ambient" aria-hidden="true"></div>
    <div class="host-loader" id="host-loader" aria-label="Loading The 1% Club">
      <div class="host-loader-glow" aria-hidden="true"></div>
      <section class="host-loader-card">
        <div class="host-loader-mark" aria-label="WMC The 1% Club"><span>WMC</span><strong>1%</strong></div>
        <span>WMC presents</span>
        <strong>Opening The 1% Club</strong>
        <div class="host-loader-track" aria-hidden="true"><i></i></div>
        <small>Preparing the studio</small>
      </section>
    </div>
    <main id="app"></main>
    <div class="how-overlay" id="how-overlay" hidden aria-hidden="true" role="dialog" aria-label="How It Works video">
      <video playsinline preload="none"></video>
      <div class="how-video-loader">
        <span class="media-spinner"><i></i></span>
        <span class="broadcast-kicker" data-video-kicker><i></i> Studio video</span>
        <strong data-video-message>Preparing the complete video</strong>
        <div class="video-progress" data-video-progress><i></i></div>
        <small data-video-progress-label>Loading 0%</small>
      </div>
      <button class="how-close" type="button" data-close-how aria-label="Close How It Works video">×</button>
    </div>
    <script type="module" src="./assets/game.js"></script>
  </body>
</html>
