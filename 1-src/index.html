<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123840" />
    <meta name="description" content="WMC presents The 1% Club — a live multiplayer gameshow experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="./assets/favicon.png" />
    <title>Host · WMC The 1% Club</title>
    <link rel="stylesheet" href="./assets/game.css" />
  </head>
  <body data-page="host">
    <div class="ambient" aria-hidden="true"></div>
    <div class="host-loader" id="host-loader" aria-label="Loading The 1% Club">
      <img src="./assets/wmc-loading-screen.png" alt="WMC presents The 1% Club — loading" />
      <div class="host-loader-shine" aria-hidden="true"></div>
    </div>
    <main id="app"></main>
    <dialog class="how-dialog" id="how-dialog">
      <div class="how-dialog-head">
        <strong>How it works</strong>
        <button class="btn compact" type="button" data-close-how>Close</button>
      </div>
      <video controls preload="metadata" playsinline src="./media/how-it-works.mp4"></video>
    </dialog>
    <script type="module" src="./assets/game.js"></script>
  </body>
</html>
